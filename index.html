<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06080e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Trolina">
<meta name="description" content="Juego de lucha arcade 2D en la terraza y el interior de La Trolina.">
<title>La Trolina Fighters</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="game/style.css?v=0.17.0">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="540" aria-label="Combate"></canvas>
    <button id="pauseBtn" aria-label="Pausa">❚❚</button>
  </div>
  <div id="touch" aria-hidden="true">
    <div class="stick-zone">
      <div class="stick-base"><i class="a-l">◀</i><i class="a-u">▲</i><i class="a-r">▶</i><i class="a-d">▼</i><div class="stick-knob"></div></div>
    </div>
    <div class="abtns">
      <button class="tbtn dash" data-act="dashArm">DASH</button>
      <button class="tbtn smoke" data-act="smoke">FUMAR<b class="count" id="cigCount">0</b></button>
      <button class="tbtn bottle" data-act="bottle"><img src="assets/bottle.png" alt="">BOTELLÍN</button>
      <button class="tbtn special" data-act="special" id="specialBtn"><span>DARDO</span></button>
      <button class="tbtn grab" data-act="grab"><img src="assets/ui/ui-agarre.png" alt="">AGARRE</button>
      <button class="tbtn kick" data-act="kick">PATADA</button>
      <button class="tbtn punch" data-act="punch">PUÑO</button>
    </div>
  </div>
</div>
<div id="ui"></div>
<button id="fsBtn" class="fs-btn" hidden aria-label="Pantalla completa">⛶ <span>Pantalla completa</span></button>
<noscript><p style="color:#fff;padding:20px">Este juego necesita JavaScript.</p></noscript>

<!-- ?v=… = TrolinaRules.GAME_VERSION: al publicar una versión nueva, súbelo aquí y en rules.js para que
     ningún móvil mezcle archivos viejos (en caché) con nuevos. tests/net.test.cjs lo comprueba. -->
